<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="D's Expense Tracker">
  <meta name="description" content="Private, local-first personal expense tracker.">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>D's Expense Tracker</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <img src="assets/icon-512.png" alt="" class="brand-icon">
        <div>
          <div class="brand-title">D's Expense Tracker</div>
          <div class="brand-subtitle">Private • Local-first</div>
        </div>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
    </header>

    <main id="view"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button class="nav-btn active" data-view="home"><span>⌂</span><small>Home</small></button>
      <button class="nav-btn" data-view="transactions"><span>▤</span><small>Transactions</small></button>
      <button class="nav-btn add-btn" id="importBtn"><span>＋</span><small>Import</small></button>
      <button class="nav-btn" data-view="deleted"><span>⌫</span><small>Deleted</small></button>
      <button class="nav-btn" data-view="rules"><span>⚙</span><small>Rules</small></button>
    </nav>
  </div>

  <input id="fileInput" type="file" hidden accept=".csv,.xlsx,.xls,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel">

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-backdrop"></div>
    <section class="modal-card" role="dialog" aria-modal="true">
      <button id="closeModal" class="modal-close" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="app.js?v=1.0.8"></script>
</body>
</html>
